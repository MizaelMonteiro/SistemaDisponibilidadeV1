<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login</title>

</head>

<body>

    <form (ngSubmit)="criarUsuario()">

        <label for="nome">Nome:</label>
        <input id="nome" type="text" name="nome" [(ngModel)]="nome" required>

        <label for="nivelAcesso">Tipo de conta:</label>
        <select id="nivelAcesso" name="nivelAcesso" [(ngModel)]="nivelAcesso" required>
            <option value="PROFESSOR">Professor</option>
            <option value="COORDENADOR">Coordenador</option>
        </select>

        <label for="identificadorInst">Identificador institucional:</label>
        <input id="identificadorInst" type="text" name="identificadorInst" [(ngModel)]="identificadorInst" required>

        <label for="email">E-mail:</label>
        <input id="email" type="email" name="email" [(ngModel)]="email" required>

        <label for="senha">Senha:</label>
        <input id="senha" type="password" name="senha" [(ngModel)]="senha" required>

        

        <button type="submit">Criar usuário</button>

    </form>
</body>

</html>
