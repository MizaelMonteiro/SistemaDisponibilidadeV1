<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login</title>

</head>
<body>
    <div class="login-container">
        <h2>Entrar</h2>
        <form (ngSubmit)="logarUsuario()">
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="Email" [(ngModel)]="email" name="email" required>
            </div>
            
            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="Senha" [(ngModel)]="senha" name="senha" required>
            </div>

            <div class="form-actions">
                <a href="/criar">Crie uma conta</a>
            </div>
            
            <div class="form-actions">
                <a href="">Esqueceu a senha?</a>
            </div>
            

            <button type="submit" class="btn-login">Acessar</button>
        </form>
    </div>
</body>
</html>
